<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Sender - ทะเลพาสเทล</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd, #e0d4fc);
            color: #334155;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(147, 197, 253, 0.3);
        }
        h2 {
            text-align: center;
            color: #0284c7;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #0369a1;
            font-weight: 400;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #7dd3fc;
            background: rgba(255, 255, 255, 0.9);
            color: #1e293b;
            border-radius: 12px;
            font-family: 'Prompt', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Prompt', sans-serif;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>💬 ส่งข้อความเข้าไลฟ์</h2>
        <div class="input-group">
            <label>ชื่อของคุณ</label>
            <input type="text" id="username" placeholder="พิมพ์ชื่อเล่น..." autocomplete="off">
        </div>
        <div class="input-group">
            <label>ข้อความ</label>
            <textarea id="message" rows="3" placeholder="พิมพ์ข้อความคุยกับสตรีมเมอร์..." autocomplete="off"></textarea>
        </div>
        <button onclick="sendMessage()">ส่งข้อความ 🚀</button>
    </div>

    <script type="module">
        window.sendMessage = function() {
            const user = document.getElementById('username').value;
            const msg = document.getElementById('message').value;
            if(!user || !msg) {
                alert('กรุณากรอกชื่อและข้อความก่อนส่งครับ!');
                return;
            }
            alert('ส่งข้อความเรียบร้อย! (เดี๋ยวเราเชื่อม Firebase ต่อ)');
            document.getElementById('message').value = '';
        }
    </script>
</body>
</html>
