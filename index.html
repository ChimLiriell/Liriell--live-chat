<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Sender - ทะเลพาสเทล</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd, #e0d4fc);
            color: #334155;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(147, 197, 253, 0.3);
        }
        h2 {
            text-align: center;
            color: #0284c7;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: #0369a1;
            font-weight: 400;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #7dd3fc;
            background: rgba(255, 255, 255, 0.9);
            color: #1e293b;
            border-radius: 12px;
            font-family: 'Prompt', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            resize: none;
        }
        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Prompt', sans-serif;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>💬 ส่งสาสน์เข้าไลฟ์</h2>
        <div class="input-group">
            <label>ข้อความของคุณ</label>
            <textarea id="message" rows="4" placeholder="พิมพ์ข้อความส่งถึงสตรีมเมอร์..." autocomplete="off"></textarea>
        </div>
        <button onclick="sendMessage()">ส่งข้อความ 🚀</button>
    </div>

    <!-- เชื่อมต่อ Firebase Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://liriell-chat-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.sendMessage = function() {
            const msg = document.getElementById('message').value.trim();
            
            if(!msg) {
                alert('กรุณากรอกข้อความก่อนส่งครับ!');
                return;
            }

            const chatRef = ref(db, 'chats');
            push(chatRef, {
                username: "ผู้ส่งสาสน์",
                message: msg,
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('message').value = '';
                alert('ส่งสาสน์ถึงแล้ว !');
            }).catch((error) => {
                alert('เกิดข้อผิดพลาดในการส่ง: ' + error.message);
            });
        }
    </script>
</body>
</html>
