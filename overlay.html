<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Live Chat Overlay - Pastel Bubble</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Prompt', sans-serif;
            background: transparent; /* โปร่งใสสำหรับซ้อนทับจอไลฟ์ใน Prism */
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        #chat-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 80vh;
            overflow-y: hidden;
            position: relative;
            z-index: 10;
        }

        .chat-item {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(186, 230, 253, 0.8);
            border-left: 5px solid #38bdf8;
            padding: 12px 18px;
            border-radius: 14px;
            color: #1e293b;
            animation: fadeIn 0.4s ease-out;
            box-shadow: 0 8px 20px rgba(147, 197, 253, 0.25);
            max-width: 450px;
        }

        .chat-user {
            font-weight: 600;
            color: #0284c7;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .chat-text {
            font-size: 16px;
            color: #334155;
            word-break: break-word;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ฟองสบู่พาสเทลลอยขึ้นฉากหลัง */
        .bubble-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(186,230,253,0.4) 60%, rgba(224,212,252,0.2));
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.8), 0 0 15px rgba(56,189,248,0.3);
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% {
                transform: translateY(-110vh) translateX(30px) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="bubble-container" id="bubbleContainer"></div>

    <div id="chat-box">
        <!-- ข้อความจะเด้งขึ้นมาตรงนี้อัตโนมัติ -->
    </div>

    <!-- เชื่อมต่อ Firebase Realtime Database เพื่อฟังข้อความแบบ Realtime -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, limitToLast, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://liriell-chat-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const chatBox = document.getElementById('chat-box');
        const chatRef = query(ref(db, 'chats'), limitToLast(15)); // ดึงข้อความล่าสุด 15 ข้อความ

        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const chatItem = document.createElement('div');
            chatItem.classList.add('chat-item');
            
            chatItem.innerHTML = `
                <div class="chat-user">${escapeHtml(data.username)} ✨</div>
                <div class="chat-text">${escapeHtml(data.message)}</div>
            `;
            
            chatBox.appendChild(chatItem);
            
            // ลบข้อความเก่าออกถ้าเยอะเกินไป
            if (chatBox.children.length > 15) {
                chatBox.removeChild(chatBox.children[0]);
            }
        });

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // สร้างฟองสบู่ลอยขึ้นอัตโนมัติ
        function createBubble() {
            const container = document.getElementById('bubbleContainer');
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            const size = Math.random() * 35 + 10;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}vw`;
            
            const duration = Math.random() * 6 + 4;
            bubble.style.animationDuration = `${duration}s`;
            
            container.appendChild(bubble);
            
            setTimeout(() => {
                bubble.remove();
            }, duration * 1000);
        }

        setInterval(createBubble, 400);
    </script>
</body>
</html>
