<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Live Chat Overlay - Pastel Bubble</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Thai', sans-serif;
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #chat-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .chat-item {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            border: 2px solid #bae6fd;
            /* ทำมุมกรอบเป็นเอกลักษณ์แนวโค้งดาวน่ารักๆ */
            border-radius: 25px 8px 25px 8px;
            padding: 12px 22px;
            color: #1e293b;
            box-shadow: 0 8px 25px rgba(147, 197, 253, 0.35);
            max-width: 400px;
            width: auto;
            display: inline-block;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chat-item.fade-out {
            animation: fadeOut 0.6s ease-out forwards;
        }

        .chat-user {
            font-weight: 600;
            color: #0284c7;
            font-size: 13px;
            margin-bottom: 3px;
        }

        .chat-text {
            font-size: 14px;
            color: #334155;
            word-break: break-word;
            line-height: 1.4;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.9) translateY(-10px); }
        }

        .bubble-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(186,230,253,0.4) 60%, rgba(224,212,252,0.2));
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.8), 0 0 15px rgba(56,189,248,0.3);
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% {
                transform: translateY(-110vh) translateX(30px) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- เล่นเสียงกระดิ่งน่ารักๆ -->
    <audio id="bellSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div class="bubble-container" id="bubbleContainer"></div>

    <div id="chat-box"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, limitToLast, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://liriell-chat-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const chatBox = document.getElementById('chat-box');
        const bellSound = document.getElementById('bellSound');
        const chatRef = query(ref(db, 'chats'), limitToLast(1));

        let hideTimer = null;
        let isFirstLoad = true; // ป้องกันไม่ให้เล่นเสียงตอนเพิ่งเปิดหน้าเว็บครั้งแรก

        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            
            // เล่นเสียงกระดิ่งเฉพาะเมื่อมีข้อความใหม่เข้ามา (ไม่ใช่ตอนโหลดข้อความเก่าหน้าแรก)
            if (!isFirstLoad) {
                bellSound.currentTime = 0;
                bellSound.play().catch(e => console.log("Audio play blocked by browser:", e));
            } else {
                isFirstLoad = false;
            }

            if (hideTimer) {
                clearTimeout(hideTimer);
            }

            chatBox.innerHTML = '';

            const chatItem = document.createElement('div');
            chatItem.classList.add('chat-item');
            
            chatItem.innerHTML = `
                <div class="chat-user">⭐️ ${escapeHtml(data.username)}</div>
                <div class="chat-text">${escapeHtml(data.message)}</div>
            `;
            
            chatBox.appendChild(chatItem);
            
            // ค้างไว้ 30 วินาทีแล้วค่อยๆ หายไป
            hideTimer = setTimeout(() => {
                chatItem.classList.add('fade-out');
                setTimeout(() => {
                    chatItem.remove();
                }, 600);
            }, 30000);
        });

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function createBubble() {
            const container = document.getElementById('bubbleContainer');
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            const size = Math.random() * 35 + 10;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}vw`;
            
            const duration = Math.random() * 6 + 4;
            bubble.style.animationDuration = `${duration}s`;
            
            container.appendChild(bubble);
            
            setTimeout(() => {
                bubble.remove();
            }, duration * 1000);
        }

        setInterval(createBubble, 400);

        // รีเฟรชหน้าเว็บทุกๆ 60 นาที
        setTimeout(() => {
            location.reload();
        }, 60 * 60 * 1000);
    </script>
</body>
</html>
